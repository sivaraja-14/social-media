name: Daily Instagram post

on:
  schedule:
    # 08:30 UTC every day — change to your audience's best time.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish to Instagram after generating'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate today's post
        run: npm run generate

      - name: Commit the image so its public URL exists
        run: |
          git config user.name "daily-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output content/history.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Post: $(date -u +%F)"
            git push
          fi

      - name: Publish to Instagram
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: node src/daily.js --publish --date=$(date -u +%F)
